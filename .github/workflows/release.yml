name: Release

# 打 tag（v2.2.2 这种格式）时自动：
#   1. 装依赖 → 自检 → 跑全部单元测试
#   2. PyInstaller 打包（onedir）
#   3. 压缩成 zip 并上传到该 tag 对应的 GitHub Release
#
# 也可以在 Actions 页面手动触发（workflow_dispatch），只产出 artifact 不建 Release。
#
# 注意：二进制不进 git。仓库里只有源码，exe 通过 Release 附件分发。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Self-check (imports + parser + i18n)
        run: python test_imports.py

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean Research_Tree_Generator.spec

      - name: Package zip
        shell: pwsh
        run: |
          $version = "dev"
          if ($env:GITHUB_REF -like 'refs/tags/*') { $version = $env:GITHUB_REF_NAME }
          $appDir = Get-ChildItem -Path "dist" -Directory | Select-Object -First 1
          if (-not $appDir) { throw "dist 目录为空，打包失败" }
          $zip = "Research_Tree_Generator_${version}_win64.zip"
          Compress-Archive -Path (Join-Path $appDir.FullName '*') -DestinationPath $zip -Force
          # 用 >> 追加（pwsh 7 写入无 BOM，避免 GitHub 解析 GITHUB_ENV 失败）
          "ASSET_NAME=$zip" >> $env:GITHUB_ENV
          Write-Host "打包完成: $zip"
          Get-Item $zip | Format-List Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ${{ env.ASSET_NAME }}
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: false
